name: Build Desktop App

# Manual run, or push a tag like `v3.0.0`.
# Produces signed installers for Windows / macOS / Linux and a GitHub Release
# with the updater manifest (latest.json) attached. The release is built as a
# draft and published by the `publish` job at the end, which also points
# `releases/latest` at it — the updater endpoint resolves `releases/latest`,
# which ignores drafts, so publishing is what rolls the update out.
#
# This workflow lives ONLY on main (the desktop release hub): a tag push runs the
# definition from the tagged main commit. The feat/tauri-desktop branch keeps no
# workflow copy (it would drift from main) — trigger both tag pushes and manual
# "Run workflow" from main; the pinned `ref` below builds that branch's app code
# either way. One v* tag on main drives both this (Tauri) and the Electron
# workflow, producing one shared Release.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # Apple Silicon (M1+)
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest" # Intel
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      # 应用代码在 feat/tauri-desktop 分支,所以这里显式 checkout 该分支。
      # 注意:此处固定了分支名;若将来该分支合并/改名,需同步更新下面的 ref。
      - uses: actions/checkout@v7
        with:
          ref: feat/tauri-desktop

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev wget file

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # tag 触发时,用 tag(去掉前缀 v)作为应用版本写入 package.json;随后的
      # update-version 会把它同步进 tauri.conf.json,于是安装包文件名、应用内嵌
      # 版本、以及 tagName(v__VERSION__)全部 == git tag,彻底消除版本错位。
      # 手动构建无 tag,跳过,沿用 feat/tauri-desktop 当前版本。
      - name: Sync version from tag
        if: github.event_name == 'push'
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Install frontend dependencies
        run: |
          yarn update-version
          yarn install --frozen-lockfile

      # tauri-action v1（此前是 v0）。三处与本流水线有关的差别：
      #  * **`.app.tar.gz` 的文件名里带上版本号**，与其它安装包一致（本仓的
      #    releaseAssetNamePattern 本来就统一了命名，所以只是回到同一套）。
      #  * **latest.json 里的下载地址用 github.com 那个地址**，不是浏览器地址。
      #  * v1 不再支持 Tauri v1（这里本来就是 v2），并且 `draft: true` 时若那条
      #    release 已经不是草稿会直接失败——矩阵的约定仍是「第一条腿建草稿，
      #    另外三条往里传产物」，所以顺序不能变。
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__ # tauri-action replaces __VERSION__ with the app version
          releaseName: "Text Diff v__VERSION__"
          releaseBody: |
            Text Diff desktop — compare two texts or files side by side and see every change highlighted. Runs fully offline; remembers your language and window layout.

            **Pick the right file for your system:**
            - **Windows (installer)**: `-setup.exe` (NSIS, recommended) or `.msi`.
            - **Windows (portable)**: `TextDiff_<version>_portable.exe` — no install, just run (needs the WebView2 runtime, preinstalled on Win 11 / current Win 10).
            - **macOS (Apple Silicon · M1/M2/M3)**: the `aarch64.dmg`.
            - **macOS (Intel)**: the `x64.dmg`.
            - **Linux**: `.AppImage` (portable), `.deb` (Debian/Ubuntu), or `.rpm` (Fedora/RHEL).

            🔄 **Auto-update**: installed apps download new versions in the background and prompt you to install — no need to revisit this page.

            ---

            Text Diff 桌面版 —— 并排对比两段文本或文件，逐处高亮差异。完全离线运行，自动记住语言与窗口布局。

            **按系统选择对应文件：**
            - **Windows（安装版）**：`-setup.exe`（NSIS，推荐）或 `.msi`。
            - **Windows（绿色便携版）**：`TextDiff_<版本>_portable.exe` —— 免安装，双击即用（需 WebView2 运行时，Win 11 / 较新 Win 10 已自带）。
            - **macOS（Apple 芯片 · M1/M2/M3）**：选 `aarch64.dmg`。
            - **macOS（Intel）**：选 `x64.dmg`。
            - **Linux**：`.AppImage`（免安装）、`.deb`（Debian/Ubuntu）或 `.rpm`（Fedora/RHEL）。

            🔄 **自动更新**：已安装的应用会在后台下载新版本并提示安装，无需再回到本页面。
          releaseDraft: true
            # **草稿**：这一趟出的是 draft release。草稿是**矩阵的汇合点**——
            # 四个平台那条矩阵里第一个跑的建出这条草稿，另外三个只往里传产物
            # （草稿不发布，四个 job 就不是各建一条 release 了）。
            #
            # 草稿里的 `latest.json` 外面看不到：更新端点读的是 `releases/latest`，
            # 而它**只认已发布的** release。真正把更新推到装好的那些应用上的，
            # 是下面 `publish` 那条 job——它把草稿发布出去并显式标成 latest，
            # **不需要人点 Publish**。
          prerelease: false
          args: ${{ matrix.args }}

      # Portable "green" build (Windows only): the raw self-contained exe that
      # tauri builds anyway — no installer, no admin rights, just run it. The web
      # assets are compiled in; the only external dependency is the WebView2
      # runtime (preinstalled on Windows 11 and current Windows 10).
      - name: Stage portable Windows exe
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp "src-tauri/target/release/TextDiff.exe" "TextDiff_${VERSION}_portable.exe"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload portable exe as workflow artifact
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: text-diff-portable-windows
          path: TextDiff_${{ env.APP_VERSION }}_portable.exe
          if-no-files-found: error

      - name: Attach portable exe to the release
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${APP_VERSION}" "TextDiff_${APP_VERSION}_portable.exe" --clobber

  # 把那条草稿发布出去，并显式把它标成 latest。
  #
  # 单独一条 job，不放在矩阵里：矩阵有四条腿（macOS 两条、Linux、Windows），
  # 四条腿都去发布会打架。`needs: publish-tauri` 保证产物都进去了才轮到它。
  publish:
    name: 发布这个 release，并把 latest 指到它
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ⚠️ **不能只发草稿了事**：草稿转成已发布时，GitHub **不会**重算
      # `releases/latest` 指向谁——2026-10-20 在 rclone-deck 上撞到过一次：release 已经是
      # `draft=false`、`prerelease=false`、`published_at` 也填上了，`releases/latest`
      # 却仍返回旧版本，端点 `releases/latest/download/latest.json` 于是 **404**
      # （旧 release 里没有 `latest.json`）。所以这里一次 PATCH 同时给
      # `draft=false` 与 `make_latest=true`，不靠 GitHub 自己挪。
      #
      # 判据是**看 API 指到谁**，不是看 release 的字段：字段全对而指针没挪，端点照样 404。
      # CDN 那层重定向还会再滞后几分钟，属正常——这里判 API，不判 CDN。
      - name: 发布这个 release，并把 latest 指到它
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # ⚠️ **不能用 `releases/tags/<tag>` 找这条 release**：那个端点**不返回草稿**。
          # 草稿只能从 release 列表里捞——列表按创建时间倒序，新建的草稿总在第一页。
          id="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                 --jq "first(.[] | select(.tag_name == \"${tag}\") | .id)")"
          if [ -z "$id" ]; then
            echo "::error::没找到 tag ${tag} 对应的 release"
            exit 1
          fi
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${id}" \
            -F draft=false -f make_latest=true > /dev/null
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          if [ "$latest" != "$tag" ]; then
            echo "::error::releases/latest 指着 ${latest}，不是 ${tag}"
            exit 1
          fi
          echo "release ${tag} 已发布，releases/latest 指向它"