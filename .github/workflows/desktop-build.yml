name: Build Desktop App

# Manual run, or push a tag like `v3.0.0`.
# Produces signed installers for Windows / macOS / Linux and a DRAFT GitHub
# Release with the updater manifest (latest.json) attached. Publish the draft
# (un-draft it) to actually roll the update out to existing installs — the
# updater endpoint resolves `releases/latest`, which ignores drafts.
#
# This workflow lives ONLY on main (the desktop release hub): a tag push runs the
# definition from the tagged main commit. The feat/tauri-desktop branch keeps no
# workflow copy (it would drift from main) — trigger both tag pushes and manual
# "Run workflow" from main; the pinned `ref` below builds that branch's app code
# either way. One v* tag on main drives both this (Tauri) and the Electron
# workflow, producing one shared Release.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # Apple Silicon (M1+)
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest" # Intel
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      # 应用代码在 feat/tauri-desktop 分支,所以这里显式 checkout 该分支。
      # 注意:此处固定了分支名;若将来该分支合并/改名,需同步更新下面的 ref。
      - uses: actions/checkout@v6
        with:
          ref: feat/tauri-desktop

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev wget file

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # tag 触发时,用 tag(去掉前缀 v)作为应用版本写入 package.json;随后的
      # update-version 会把它同步进 tauri.conf.json,于是安装包文件名、应用内嵌
      # 版本、以及 tagName(v__VERSION__)全部 == git tag,彻底消除版本错位。
      # 手动构建无 tag,跳过,沿用 feat/tauri-desktop 当前版本。
      - name: Sync version from tag
        if: github.event_name == 'push'
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Install frontend dependencies
        run: |
          yarn update-version
          yarn install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__ # tauri-action replaces __VERSION__ with the app version
          releaseName: "Text Diff v__VERSION__"
          releaseBody: |
            Text Diff desktop — compare two texts or files side by side and see every change highlighted. Runs fully offline; remembers your language and window layout.

            **Pick the right file for your system:**
            - **Windows (installer)**: `-setup.exe` (NSIS, recommended) or `.msi`.
            - **Windows (portable)**: `TextDiff_<version>_portable.exe` — no install, just run (needs the WebView2 runtime, preinstalled on Win 11 / current Win 10).
            - **macOS (Apple Silicon · M1/M2/M3)**: the `aarch64.dmg`.
            - **macOS (Intel)**: the `x64.dmg`.
            - **Linux**: `.AppImage` (portable), `.deb` (Debian/Ubuntu), or `.rpm` (Fedora/RHEL).

            🔄 **Auto-update**: installed apps download new versions in the background and prompt you to install — no need to revisit this page.

            ---

            Text Diff 桌面版 —— 并排对比两段文本或文件，逐处高亮差异。完全离线运行，自动记住语言与窗口布局。

            **按系统选择对应文件：**
            - **Windows（安装版）**：`-setup.exe`（NSIS，推荐）或 `.msi`。
            - **Windows（绿色便携版）**：`TextDiff_<版本>_portable.exe` —— 免安装，双击即用（需 WebView2 运行时，Win 11 / 较新 Win 10 已自带）。
            - **macOS（Apple 芯片 · M1/M2/M3）**：选 `aarch64.dmg`。
            - **macOS（Intel）**：选 `x64.dmg`。
            - **Linux**：`.AppImage`（免安装）、`.deb`（Debian/Ubuntu）或 `.rpm`（Fedora/RHEL）。

            🔄 **自动更新**：已安装的应用会在后台下载新版本并提示安装，无需再回到本页面。
          releaseDraft: true
            # **草稿**：这一趟出的是 draft release。草稿里的 `latest.json` 外面看不到 ——
            # 更新端点读的是 `releases/latest`，而它**只认已发布的** release。
            # 所以出完这一趟还要把草稿**发布出去**，那一下才是真的把更新推到装好的那些应用上。
            #
            # ⚠️ **发布出去之后还要确认 `releases/latest` 真的指到了新版本**。2026-10-20 在
            # rclone-deck 上撞到过一次：release 已经是 `draft=false`、`prerelease=false`、
            # `published_at` 也填上了，`releases/latest` 却仍返回旧版本，端点
            # `releases/latest/download/latest.json` 于是 **404**（旧 release 里没有 `latest.json`）。
            # 判据是**把端点本身拉下来看**里面的 `"version"`，不是看 release 的字段：
            #
            # ```powershell
            # (Invoke-WebRequest 'https://github.com/rockbenben/text-diff/releases/latest/download/latest.json').Content
            # ```
            #
            # 若还是旧版本号，就把这条 release 显式标成 latest：
            # `PATCH /repos/rockbenben/text-diff/releases/<id>` 带 `make_latest=true`。
            # 标完之后 API 立刻改指；CDN 那层重定向还会再滞后几分钟，属正常。
          prerelease: false
          args: ${{ matrix.args }}

      # Portable "green" build (Windows only): the raw self-contained exe that
      # tauri builds anyway — no installer, no admin rights, just run it. The web
      # assets are compiled in; the only external dependency is the WebView2
      # runtime (preinstalled on Windows 11 and current Windows 10).
      - name: Stage portable Windows exe
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp "src-tauri/target/release/TextDiff.exe" "TextDiff_${VERSION}_portable.exe"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Upload portable exe as workflow artifact
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: text-diff-portable-windows
          path: TextDiff_${{ env.APP_VERSION }}_portable.exe
          if-no-files-found: error

      - name: Attach portable exe to the release
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${APP_VERSION}" "TextDiff_${APP_VERSION}_portable.exe" --clobber